# Jellyfin with LCARS as its web UI: Jellyfin's own web client is turned off and LCARS serves
# the browser side. Adjust the volume paths, then
#   docker compose -f compose.with-jellyfin.yml up -d
# and open http://<this host>:8080.
#
# Turning the official web client off also removes Jellyfin's admin dashboard, which is part
# of it. Do the first-run setup (and later server settings) with it on: comment out
# JELLYFIN_hostwebclient, open http://<this host>:8096, then put it back.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # The server stops hosting jellyfin-web (the same as --nowebclient). The API, streaming
      # and the TV and phone apps carry on as before.
      JELLYFIN_hostwebclient: "false"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /path/to/media:/media:ro
    ports:
      # For Jellyfin's TV, phone and desktop apps, which talk to the server directly. Leave it
      # out if browsers (through LCARS) are the only clients.
      - "8096:8096"

  lcars:
    image: ghcr.io/luckynos7evin/jellyfin-lcars:latest
    container_name: jellyfin-lcars
    restart: unless-stopped
    depends_on: [jellyfin]
    ports:
      - "8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
    environment:
      GOMEMLIMIT: 48MiB
      # Jellyfin by its service name on the Compose network.
      JELLYFIN_URL: http://jellyfin:8096
      # Who may connect, as CIDRs (the direct peer: a browser, or your reverse proxy).
      # Default: private, Docker, CGNAT and loopback ranges.
      # JFL_ALLOWED_CIDRS: 192.168.0.0/16,127.0.0.1/32
