# Tests, then builds the container image and pushes it to GHCR:
#   ghcr.io/luckynos7evin/jellyfin-lcars:<first 7 of the commit>   every push to main
#   ghcr.io/luckynos7evin/jellyfin-lcars:latest                     the newest main
#   ghcr.io/luckynos7evin/jellyfin-lcars:v1.2.3                     a v* tag
# The commit tag is also the build version the app puts in its asset URLs (/static/<version>/).
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          short=${GITHUB_SHA::7}
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jellyfin-lcars
          tags="$image:$short"
          version=$short
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags="$tags,$image:$GITHUB_REF_NAME"; version=$GITHUB_REF_NAME; fi
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
